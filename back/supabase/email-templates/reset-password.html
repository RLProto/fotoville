<!-- Supabase > Authentication > Emails > Reset password. Assunto: Nova senha da sua conta Fotoville -->
<div style="margin:0;padding:24px 16px;background:#F3F5F7;font-family:Arial,Helvetica,sans-serif;color:#1B1F33">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:12px;padding:32px 28px">
    <p style="margin:0 0 24px;font-size:18px;font-weight:bold;letter-spacing:.02em">Fotoville</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3">Criar nova senha</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Recebemos um pedido de nova senha para {{ .Email }}.</p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#4F5D9E;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:bold;padding:14px 24px;border-radius:10px">Criar nova senha</a>
    </p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#4E546A">O link vale por 1 hora. Se você não pediu, ignore este e-mail: sua senha continua a mesma.</p>
  </div>
</div>
